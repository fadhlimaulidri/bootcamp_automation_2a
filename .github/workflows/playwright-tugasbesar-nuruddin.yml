name: Playwright Tests (Tugas Besar Nuruddin)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: fadhlimaulidri/bootcamp_automation_2a:base
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Run Playwright tests
        run: npx playwright test tests/ui/register/register-agentq.spec.ts tests/api/register/register.spec.ts
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          TOKEN: ${{ secrets.AGENTQ_TOKEN }}
          AGENTQ_PROJECT_ID: ${{ secrets.NURUDDIN_PROJECT_ID }}
          AGENTQ_TESTRUN_ID: ${{ secrets.NURUDDIN_TESTRUN_ID }}
          AGENTQ_EMAIL: ${{ secrets.NURUDDIN_EMAIL }}
          AGENTQ_PASSWORD: ${{ secrets.NURUDDIN_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
